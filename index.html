<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#dff2c9">
  <title>川麻 · 单机体验</title>
  <link rel="stylesheet" href="./style.css?v=42">
</head>
<body>
  <main id="app" aria-live="polite"></main>
  <div id="wall-notice-overlay" class="wall-notice" role="status" hidden><span class="wall-petal" aria-hidden="true">✿</span><strong>余 <em>10</em> 张</strong></div>
  <aside id="landscape-guide" aria-label="横屏游玩提示">
    <div class="landscape-guide-card">
      <span class="landscape-guide-art" aria-hidden="true">▯ ↻ ▭</span>
      <h1>横屏玩更舒适</h1>
      <p>请关闭手机的竖屏锁定，然后将手机横过来。牌桌会自动切换为横屏布局。</p>
      <button id="landscape-start" class="primary" type="button">尝试全屏横屏</button>
      <small id="landscape-feedback">如果没有自动旋转，请手动横置手机。</small>
    </div>
  </aside>
  <script type="module" src="./src/main.js?v=43"></script>
</body>
</html>
